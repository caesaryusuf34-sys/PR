# TEMPLATE — copy to .github/workflows/sportsai.yml to let GitHub run the learning loop unattended.
# It syncs ESPN data, collects results for logged predictions, evaluates them, retrains when the
# learning policy says a cycle is due, and commits the updated store/ (database + model registry).
name: sportsai-update
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -m sportsai update
      - run: |
          git config user.name "sportsai-bot"
          git config user.email "sportsai-bot@users.noreply.github.com"
          git add store
          git diff --cached --quiet || git commit -m "sportsai: scheduled update"
          git push
